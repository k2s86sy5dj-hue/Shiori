function initFirebaseSync() {
disconnectFirebase();
var config = getActiveFirebaseConfig();
if (!config || typeof firebase === 'undefined') {
updateSyncStatusUI(false, 'ローカル保存中');
return;
}
updateSyncStatusUI(false, 'クラウド接続中...');
try {
firebaseAppInstance = firebase.initializeApp(config, 'trip-sync-' + Date.now());
var auth = firebaseAppInstance.auth();
auth.signInAnonymously().catch(function() {}).finally(function() {
if (!firebaseAppInstance) return;
db = firebaseAppInstance.firestore();
subscribeToTripRoom(currentRoomId);
});
} catch (error) {
console.error('Firebase initialization failed:', error);
updateSyncStatusUI(false, '接続エラー');
}
}
